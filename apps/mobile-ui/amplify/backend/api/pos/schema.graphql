# Reporting

type ProductSaleSummary {
    productId: String!
    productName: String!
    unitOfMeasure: String!
    quantity: Float!
    amount: Float!
}

type EmployeeSaleSummary {
    employeeId: String!
    employeeName: String!
    orders: Int!
    amount: Float!
}

type DatePartSaleSummary {
    datePart: String!
    orders: Int!
    amount: Float!
}

type SalesSummary {
    products: [ProductSaleSummary]
    employees: [EmployeeSaleSummary]
    dates: [DatePartSaleSummary]
    totalAmount: Float!
    totalOrders: Float!
}

input FinalizeInventoryReceiveLineInput {
  id: ID
  productId: String!
  productName: String!
  unitOfMeasure: String!
  received: Float!
  comments: String
}

input FinalizeInventoryCountLineInput {
  id: ID
  productId: String!
  productName: String!
  unitOfMeasure: String!
  current: Float!
  newCount: Float!
  comments: String
}

input FinalizeInventoryReceiveInput {
  receiveId: ID
  operationId: ID!
  comments: String
  createdBy: ByEmployeeInput!
  lines: [FinalizeInventoryReceiveLineInput!]!
}

input FinalizeInventoryCountInput {
  countId: ID
  operationId: ID!
  comments: String
  createdBy: ByEmployeeInput!
  lines: [FinalizeInventoryCountLineInput!]!
}

type InventoryProductFinalizeResult {
  productId: ID!
  finalQuantity: Float!
  appliedDelta: Float!
}

type InventoryFinalizeResult {
  sourceId: ID!
  sourceType: String!
  status: InventoryApplyState!
  appliedAt: AWSDateTime
  error: String
  affectedProducts: [InventoryProductFinalizeResult!]!
}

type Query {
  getSales(statuses: [OrderStatus!]!, from: String!, to: String!): [Order] @function (name: "getSales-${env}")
  getSalesSummary(statuses: [OrderStatus!]!, from: String!, to: String!): SalesSummary @function (name: "getSalesSummaryQuery-${env}")
  finalizeInventoryReceive(input: FinalizeInventoryReceiveInput!): InventoryFinalizeResult @function(name: "inventoryLifecycle-${env}")
  finalizeInventoryCount(input: FinalizeInventoryCountInput!): InventoryFinalizeResult @function(name: "inventoryLifecycle-${env}")
}
