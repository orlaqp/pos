}

enum PricingApprovalType {
  DISCOUNT
  PRICE_OVERRIDE
}

enum PricingApprovalDecision {
  APPROVED
  REJECTED
}

enum PricingSource {
  ONLINE_VALIDATED
  OFFLINE_LOCAL
}

enum ReconciliationStatus {
  NOT_REQUIRED
  PENDING
  RECONCILED
  RECONCILED_WITH_EXCEPTION
}

