}

type TenantUser @model @auth(rules: [{ allow: owner, ownerField: "userId", identityClaim: "sub" }]) {
  id: ID!
  tenantId: ID! @index(name: "byTenantId", queryField: "tenantUsersByTenant")
  userId: String! @index(name: "byUserId", queryField: "tenantUsersByUser")
  role: TenantUserRole!
}

enum CategoryDiscountPolicyMode {
  DEFAULT
  FORCE_INCLUDE
  FORCE_EXCLUDE
}

enum DiscountDefinitionStatus {
  DRAFT
  ACTIVE
  INACTIVE
  EXPIRED
}

enum DiscountDefinitionType {
  MANUAL
  AUTOMATIC
  PROMO_CODE
}

enum DiscountMethod {
  PERCENT
  AMOUNT
  FINAL_PRICE
}

enum DiscountScope {
  LINE
  ORDER
}

enum DiscountStackMode {
  EXCLUSIVE
  STACKABLE
  BEST_PRICE_ONLY
}

enum DiscountApplicationType {
  MANUAL_LINE_DISCOUNT
  MANUAL_ORDER_DISCOUNT
  AUTOMATIC_DISCOUNT
  PROMO_CODE
  PRICE_OVERRIDE
}

enum DiscountApprovalStatus {
  NOT_REQUIRED
  APPROVED
