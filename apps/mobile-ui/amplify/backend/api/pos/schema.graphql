enum TenantUserRole {
  OWNER
  ADMIN
}

type Tenant @model @auth(rules: [{ allow: owner, ownerField: "ownerUserId", identityClaim: "sub" }]) {
  id: ID!
  name: String!
  slug: String! @index(name: "bySlug", queryField: "tenantBySlug")
