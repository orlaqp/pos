type Order @model @auth(rules: [{allow: owner, ownerField: "tenantId", identityClaim: "sub"}, {allow: private, provider: iam, operations: [read, update]}]) {
  id: ID!
  tenantId: ID!
  orderNo: String! @index(name: "byOrderNo")
  orderDate: AWSDateTime! @index(name: "byOrderDate")
  baseSubtotal: Float
  subtotal: Float!
  lineDiscountTotal: Float
  orderDiscountTotal: Float
  discountTotal: Float
  savingsTotal: Float
  tax: Float!
  total: Float!
  currentSubtotal: Float
  currentDiscountTotal: Float
  currentTax: Float
  currentTotal: Float
  promoCodes: [String]
  pricingVersion: String
  pricingSnapshotHash: String
  pricingSource: PricingSource
  reconciliationStatus: ReconciliationStatus
  appliedDiscountSummary: AppliedDiscountSummarySnapshot
  status: OrderStatus! @index(name: "byStatusByOrderDate", sortKeyFields: ["orderDate"])
  employeeId: String!
  employeeName: String!
  lines: [OrderLine]!
  paymentInfo: PaymentInfo
  refundInfo: RefundInfo
  createdBy: ByEmployee
  updatedBy: ByEmployee
  inventoryApplyState: InventoryApplyState
  inventoryAppliedAt: AWSDateTime
  inventoryApplyOperationId: ID
  inventoryApplyError: String
  Customer: Customer @hasOne
}

